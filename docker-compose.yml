version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: edunyte_frontend
    restart: always
    ports:
      - "3030:80" # Maps VPS port 3030 to Nginx port 80 in container
    env_file:
      - ./frontend/.env

  backend:
    build: ./backend
    container_name: edunyte_backend
    restart: always
    ports:
      - "3031:8096" # Maps VPS port 3031 to backend port 8096
    env_file:
      - ./backend/.env

  admin:
    build: ./admin
    container_name: edunyte_admin
    restart: always
    ports:
      - "3032:80" # Maps VPS port 3032 to Nginx port 80 in container
    env_file:
      - ./admin/.env
